name: Verificar aplicação
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Compilar Worker API
        if: github.event_name == 'push'
        run: |
          node --input-type=commonjs -e "const fs=require('fs');const ts=require('typescript');const src=fs.readFileSync('worker/index.ts','utf8');const out=ts.transpileModule(src,{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ES2022}}).outputText;fs.writeFileSync('worker/index.js',out);"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.js
          if ! git diff --cached --quiet; then
            git commit -m "Build deployable FLUXO API Worker"
            git push
          fi
      - run: npm run build
