name: Backup diário do D1 para R2

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluxo-gestao-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Wrangler
        run: npm install --global wrangler@4

      - name: Exportar banco D1 remoto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e267f457a13da4e0d9969a63da2d02f6
        run: |
          set -euo pipefail
          wrangler d1 export fluxo-gestao --remote --output=./fluxo-gestao-backup.sql --skip-confirmation
          test -s ./fluxo-gestao-backup.sql
          sha256sum ./fluxo-gestao-backup.sql > ./fluxo-gestao-backup.sql.sha256

      - name: Enviar backup ao Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          BACKUP_DATE="$(date -u +%Y-%m-%d)"
          ENDPOINT="https://e267f457a13da4e0d9969a63da2d02f6.r2.cloudflarestorage.com"
          aws s3 cp ./fluxo-gestao-backup.sql "s3://fluxo-gestao-backups/d1/daily/${BACKUP_DATE}/fluxo-gestao-backup.sql" --endpoint-url "$ENDPOINT"
          aws s3 cp ./fluxo-gestao-backup.sql.sha256 "s3://fluxo-gestao-backups/d1/daily/${BACKUP_DATE}/fluxo-gestao-backup.sql.sha256" --endpoint-url "$ENDPOINT"
          aws s3api head-object --bucket fluxo-gestao-backups --key "d1/daily/${BACKUP_DATE}/fluxo-gestao-backup.sql" --endpoint-url "$ENDPOINT"

      - name: Resumo do backup
        run: |
          echo "Backup D1 exportado e enviado ao R2."
          ls -lh ./fluxo-gestao-backup.sql ./fluxo-gestao-backup.sql.sha256
